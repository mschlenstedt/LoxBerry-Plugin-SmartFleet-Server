<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SmartFleet Server">
<title>SmartFleet Server</title>
<!--
  SmartFleet Server - Icon fuer das LoxBerry-Plugin, das den Server
  installiert. Noch nicht in Gebrauch: Das Plugin gibt es zum Zeitpunkt
  dieser Datei noch nicht.

  Der Miniserver ist die Zeichnung aus main_miniserver.svg des LoxBerry-Cores,
  unveraendert uebernommen - nur der Hintergrund des Originals ist entfernt
  und die Zeichnung neu platziert (61,541 x 33,129 Einheiten, Mitte bei
  31,941 / 32,552; die Werte sind aus den verschachtelten Transformationen
  des Originals ausgerechnet).

  Die Anordnung folgt einem gaengigen Cloud-Computing-Zeichen: vier
  Umriss-Ringe fuer die Standorte, Diagonalen zur Mitte, vier gefuellte
  Punkte dazwischen. In der Mitte steht statt der ueblichen Wolke das Geraet.

  WARUM NUR EIN GERAET UND NICHT VIER: An den vier Aussenpositionen waere
  seine Klemmleiste bei 64 Pixeln nur 0,75 Pixel hoch - unter einem Pixel
  bleibt vom Miniserver ein grauer Schleier. In der Mitte sind es 1,4 Pixel,
  und das reicht.

  Die Punkte links und rechts stehen weiter aussen als die oben und unten:
  Das Geraet ist breit und flach, seine Freistellung reicht bis 132, ein
  Punkt an der symmetrischen Stelle verschwaende darunter.

  Grund und Eckradius wie beim Client und beim Smartmeter-Plugin.
-->
