PLUGINTITLE="SmartFleet Server"
TEXT_EINGERICHTET="The SmartFleet server is set up and running on this LoxBerry."
BTN_OEFFNEN="Open SmartFleet Server"
TITEL_SCHRITTE="How to create the first login"
SCHRITT_1="Click “Open SmartFleet Server”."
SCHRITT_2="Accept the browser’s certificate warning once. This plugin created the certificate itself."
SCHRITT_3="On the setup page, click “Use sendmail and test”. SmartFleet sends a test email with a four-digit code to"
SCHRITT_4="Enter the code within 15 minutes and create the first login."
TITEL_NURTEST="For internal testing only"
TEXT_NURTEST="Self-signed certificate, Free licence with 2 sites. For permanent use, SmartFleet belongs on web hosting with its own certificate."
TITEL_FEHLER="Setup failed"
TEXT_FEHLER="Fix the cause, then install the plugin again. The full log is in the LoxBerry log manager."
TITEL_OFFEN="Not set up yet"
TEXT_OFFEN="The SmartFleet server is not set up on this LoxBerry yet. Install the plugin again to start the setup."
