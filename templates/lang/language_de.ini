[SFS]
PLUGINTITLE="SmartFleet Server"
TEXT_EINGERICHTET="Der SmartFleet-Server ist eingerichtet und läuft auf diesem LoxBerry."
BTN_OEFFNEN="SmartFleet Server öffnen"
TITEL_SCHRITTE="So legst du den ersten Zugang an"
SCHRITT_1="Klicke auf „SmartFleet Server öffnen“."
SCHRITT_2="Bestätige die Zertifikatswarnung des Browsers einmal. Das Zertifikat hat dieses Plugin selbst erzeugt."
SCHRITT_3="Klicke auf der Einrichtungsseite auf „Sendmail verwenden und testen“. SmartFleet schickt eine Testmail mit einem vierstelligen Code an"
SCHRITT_4="Gib den Code innerhalb von 15 Minuten ein und lege den ersten Zugang an."
TITEL_NURTEST="Nur für interne Tests"
TEXT_NURTEST="Selbst signiertes Zertifikat, Free-Lizenz mit 2 Standorten. Für den Dauerbetrieb gehört SmartFleet auf ein Webhosting mit eigenem Zertifikat."
TITEL_FEHLER="Einrichtung gescheitert"
TEXT_FEHLER="Behebe die Ursache und installiere das Plugin danach erneut. Das vollständige Protokoll steht im Log-Manager des LoxBerry."
TITEL_OFFEN="Noch nicht eingerichtet"
TEXT_OFFEN="Der SmartFleet-Server ist auf diesem LoxBerry noch nicht eingerichtet. Installiere das Plugin erneut, um die Einrichtung zu starten."
